    <main>
        <section id="contacto">
            <h1>Contacto</h1>
            
            <form id="form-contacto" class="mt-3">
                <div class="grupo-form">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Andres Mendoza"
                           pattern="[A-Za-záéíóúÁÉÍÓÚüÜñÑ\s]+"
                           title="Solo se permiten letras y espacios">
                </div>
                
                <div class="grupo-form">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
                </div>
                
                <div class="grupo-form">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="¿En qué te puedo ayudar?"></textarea>
                </div>
                
                <button type="submit" class="btn mt-2">Enviar Mensaje</button>
                <p id="mensaje-estado" class="mt-2 mb-0"></p>
            </form>

            <aside>
                <h2>Redes Profesionales</h2>
                <ul class="mb-0 mt-2">
                    <li><a href="mailto:meoa090828hmcnlna9@gmail.com">Enviar correo electrónico a Andrés</a></li>
                    <li><a href="https://github.com/andres-mendoza-olvera" target="_blank" rel="noopener noreferrer">Ver perfil de Andrés en GitHub</a></li>
